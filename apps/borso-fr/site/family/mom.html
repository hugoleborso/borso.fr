<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Je t'aime maman</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        background-color: pink;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        text-align: center;
        animation: bg-color-change 5s infinite;
      }

      h1 {
        font-size: 3em;
        color: red;
        text-shadow: 2px 2px 5px yellow;
        animation: text-glow 1s infinite alternate;
      }

      img {
        width: min(300px, 85vw);
        height: auto;
        background: white;
        padding: 8px;
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        animation: image-bounce 2s infinite;
      }

      @keyframes bg-color-change {
        0% {
          background-color: pink;
        }
        25% {
          background-color: lightblue;
        }
        50% {
          background-color: lightgreen;
        }
        75% {
          background-color: lightyellow;
        }
        100% {
          background-color: pink;
        }
      }

      @keyframes text-glow {
        0% {
          text-shadow: 2px 2px 10px yellow;
        }
        100% {
          text-shadow: 2px 2px 20px orange;
        }
      }

      @keyframes image-bounce {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(-20px) rotate(3deg);
        }
      }
    </style>
  </head>
  <body>
    <h1>Je t'aime maman</h1>
    <img src="mom-drawing.svg" alt="Dessin de maman qui tient un bébé" />
  </body>
</html>
