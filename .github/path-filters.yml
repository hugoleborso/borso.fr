# Used by the preview + deploy workflows to detect which apps need a
# (re)deploy on a given PR / push. Each filter key maps to a path glob.
#
# Two kinds of keys:
#   - One per app: `<slug>: 'apps/<slug>/**'`. When a PR touches paths
#     matching this filter, only that app gets deployed.
#   - The special `infra` key, matching `infra/cdk/**`. When constructs
#     change, every app's preview / prod gets redeployed because the
#     constructs are the contract.
#
# The `deps` key matches the files that decide every workspace's dependency
# versions. It exists because a bump can change what all four applications
# resolve without touching one byte under `apps/`: the catalog in
# `pnpm-workspace.yaml` holds the version and each package.json says
# `catalog:`. React 19.0 -> 19.2.8 and jsdom 25 -> 30 both merged with a green
# tick and no application suite run at all, because no app filter matched. Like
# `infra`, this key fans out to every app rather than naming one.
# See docs/dantotsus/a-dependency-bump-that-no-app-filter-could-see.md.
#
# `infra/shared/**` is intentionally NOT a filter — its deploy flow is
# manual/local-only (see docs/flows.md). It does not redeploy app stacks.
#
# Adding a new app: append `<slug>: 'apps/<slug>/**'` here, plus the slug
# in commitlint.config.js scope-enum. The workflows pick it up automatically
# by listing the directories under `apps/`, which is what pnpm-workspace.yaml
# declares as `apps/*` — no install needed to know the slugs.

borso-fr: 'apps/borso-fr/**'
borsouvertures: 'apps/borsouvertures/**'
last-loop-lepin: 'apps/last-loop-lepin/**'
pragma: 'apps/pragma/**'
infra: 'infra/cdk/**'
deps:
  - 'pnpm-workspace.yaml'
  - 'pnpm-lock.yaml'
  - 'package.json'
  - 'apps/*/package.json'
  - 'infra/*/package.json'
