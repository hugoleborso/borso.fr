# The unscoped gate: every application, every suite, mutation included.
#
# Pre-push and `ci` are both scoped — pre-push mutates only the pure files a
# push touches, `ci` tests only the apps a pull request changes. That is what
# keeps them affordable enough to be run rather than skipped, and it leaves one
# hole: a change in app A that resurrects a mutant in app B, or in a file the
# push never touched. This workflow is that hole's backstop. It runs after the
# merge, on main, where nobody is waiting on it.
#
# One job per app, in parallel, so wall-clock is the slowest single app rather
# than the sum of four.

name: full-suite

on:
  push:
    branches: [main]
  workflow_dispatch:

# Not cancel-in-progress: each commit on main deserves its own verdict, and a
# run cancelled halfway proves nothing about the commit that cancelled it.
concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: compute
        run: |
          apps=$(pnpm ls -r --depth -1 --filter "./apps/*" --json \
            | jq -c '[.[] | .name | sub("@borso-app/"; "")]')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  app:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
      fail-fast: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra build

      - name: Pure suites and the per-file coverage gate
        run: |
          if grep -q '"test:core"' "apps/$APP/package.json"; then
            pnpm --filter "@borso-app/$APP" run test:core
          else
            pnpm --filter "@borso-app/$APP" run test:coverage
          fi

      - name: Back-end end-to-end suite
        if: hashFiles(format('apps/{0}/api/**', matrix.app)) != ''
        run: pnpm --filter "@borso-app/$APP" exec vitest run --project back-e2e

      # Stryker's incremental file records, per mutant, the tests that covered
      # it and the hash of the source it came from. Restoring it means a run
      # re-tests the mutants whose source or tests moved and reuses the verdict
      # for the rest. A cache miss simply costs a full run.
      - uses: actions/cache@v6
        with:
          path: apps/${{ matrix.app }}/reports/mutation/incremental.json
          key: stryker-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.app }}-

      - name: Mutation testing, every pure file
        run: |
          pnpm --filter "@borso-app/$APP" exec stryker run \
            --incremental \
            --incrementalFile reports/mutation/incremental.json

  # The repository's own tooling, unscoped, for the same reason the applications
  # get this job: pre-push mutates only the pure files a push touches, so a
  # change to one generator can resurrect a mutant in another.
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - uses: actions/cache@v6
        with:
          path: reports/mutation/incremental.json
          key: stryker-tooling-${{ github.sha }}
          restore-keys: |
            stryker-tooling-
      - name: Mutation testing, every pure module under scripts/
        run: |
          pnpm exec stryker run \
            --incremental \
            --incrementalFile reports/mutation/incremental.json

  # infra/cdk's five pure modules rewrite every migration before it reaches
  # DSQL. Unscoped here for the same reason the applications are: pre-push
  # mutates only what a push touches.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra run test:coverage
      - uses: actions/cache@v6
        with:
          path: infra/cdk/reports/mutation/incremental.json
          key: stryker-infra-cdk-${{ github.sha }}
          restore-keys: |
            stryker-infra-cdk-
      - name: Mutation testing, every pure module under infra/cdk
        run: |
          pnpm --filter @borso/infra exec stryker run \
            --incremental \
            --incrementalFile reports/mutation/incremental.json

  # The backstop had no reader. It ran on main "where nobody is waiting on it",
  # which is true and was the whole problem: it went red on 2026-08-16 and
  # stayed red for twenty consecutive runs and four days, and the thing it was
  # reporting — five surviving mutants in one file — was found only because
  # somebody went looking at the workflow list for an unrelated reason. A red
  # run that notifies nobody is not a gate, it is a log.
  #
  # A commit comment lands on the commit page and in the author's GitHub
  # notifications, which is the one place a merge author already looks. It runs
  # only on failure, so a green main stays silent.
  # See docs/dantotsus/the-backstop-nobody-was-standing-behind.md.
  report-failure:
    needs: [app, infra]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                '**`full-suite` is red on `main`.**',
                '',
                'This is the unscoped backstop: every application, every suite,',
                'mutation included. Nothing else runs it, so until it is green',
                'again `main` carries a regression that no pull request will show.',
                '',
                `[Failing run \u2197](${run})`,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
