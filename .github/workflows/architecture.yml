# What a pull request does to each application's architecture, in one comment.
#
# `architecture-graph.ts --check` already fails a commit whose generated page is
# stale, so the page in the branch is always current. What that gate cannot do
# is say what changed, because a generated HTML file diffs badly and the JSON
# model diffs as a wall of lines. This workflow answers that: it builds the
# model for the merge base and for the head, and reports the difference as
# routes, externals and layers rather than as text.
#
# The target branch does not need to carry the generator. The script runs at the
# head revision against a worktree of the base, through `--app-root`, so a
# branch opened before this workflow existed still gets a comparison.

name: architecture

on:
  pull_request:
    # `closed` is here for the teardown below, and it is the only reason the
    # default set is spelled out: naming any type at all replaces the default.
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/**'
      - 'scripts/architecture/**'
      - '.claude/skills/blueprint/blueprint-utils.ts'
      - '.github/workflows/architecture.yml'

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Minting an OIDC token is what lets the publish step assume
  # PreviewDeployRole. That is the same role preview.yml uses, and its trust
  # policy already names `pull_request`, so no permission had to be granted in
  # AWS to add this.
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  architecture:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The pages are not committed, so this both produces them for the artifact
      # below and, through --check, catches a committed model the code has
      # moved past on a push that skipped the hook.
      - name: Build the head model
        run: pnpm exec tsx scripts/architecture/architecture-graph.ts

      - name: Fail when the committed model is stale
        run: pnpm exec tsx scripts/architecture/architecture-graph.ts --check

      # A worktree of the merge base, scanned by the head revision's generator.
      # The merge base rather than the branch tip, so the comparison describes
      # this pull request and not whatever else landed on the target meanwhile.
      - name: Build the target-branch models and diff them
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          echo "Comparing against $base_sha on ${{ github.base_ref }}"
          git worktree add --detach ../architecture-base "$base_sha"
          : > /tmp/architecture-diff.md
          for app in $(pnpm exec tsx scripts/architecture/architecture-graph.ts --list); do
            # An application the target branch does not have yet cannot be
            # compared, and its whole map is new by definition.
            if [ ! -d "../architecture-base/apps/$app" ]; then
              printf '## %s\n\nNew application on this branch; nothing to compare.\n\n' "$app" \
                >> /tmp/architecture-diff.md
              continue
            fi
            pnpm exec tsx scripts/architecture/architecture-graph.ts \
              --app "$app" \
              --app-root "../architecture-base/apps/$app" \
              --out /tmp/architecture-base
            # The marker, not the heading, is what the comment step turns into
            # a link. The report under it carries headings of its own, and a
            # regular expression over `## ` cannot tell an application's name
            # from a section's.
            printf '## %s\n\n<!--architecture-app:%s-->\n\n' "$app" "$app" \
              >> /tmp/architecture-diff.md
            pnpm exec tsx scripts/architecture/architecture-diff.ts \
              "/tmp/architecture-base/$app-architecture.json" \
              "docs/architecture/$app-architecture.json" >> /tmp/architecture-diff.md
            # The same comparison as a map rather than a list: the head model's
            # own graphs, with each block coloured by what this branch did to it.
            # --diff-ref hands the generator the base revision, which is what
            # lets git pair a rename instead of reporting an addition beside a
            # deletion, and what lets the code dialog open on the change.
            pnpm exec tsx scripts/architecture/architecture-graph.ts \
              --app "$app" --diff-base /tmp/architecture-base --diff-ref "$base_sha"
            printf '\n' >> /tmp/architecture-diff.md
          done
          cat /tmp/architecture-diff.md >> "$GITHUB_STEP_SUMMARY"

      # The maps go to the previews CDN that already answers for
      # `<app>-pr-<n>.preview.borso.fr`. Its routing function reads any
      # `<name>-pr-<n>` host and serves `/<name>/pr-<n>/` from the previews
      # bucket, so `architecture` is just another name to it: no bucket, no
      # distribution, no certificate and no DNS record had to be added. Objects
      # in that bucket expire after 60 days on their own, which is why nothing
      # here tears them down.
      #
      # Both steps may fail without failing the report. AWS being unreachable
      # is not a reason to lose the diff comment, and the artifact below still
      # carries the same pages.
      - name: Authenticate to AWS
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the maps
        id: publish
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          bucket="$(aws ssm get-parameter --name /borso/shared/previews-bucket-name \
            --query Parameter.Value --output text)"
          distribution="$(aws ssm get-parameter --name /borso/shared/previews-distribution-id \
            --query Parameter.Value --output text)"
          prefix="architecture/pr-${{ github.event.pull_request.number }}"
          aws s3 sync docs/architecture "s3://$bucket/$prefix/" --delete --only-show-errors
          # A push writes the same keys, and the edge would go on serving the
          # previous maps for its default TTL without this.
          aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths "/$prefix/*" --query 'Invalidation.Id' --output text

      # The page is the browsable half, and this artifact is what a reader who
      # wants the whole folder offline downloads.
      - name: Upload the browsable page
        uses: actions/upload-artifact@v4
        with:
          name: architecture-maps
          path: |
            docs/architecture/index.html
            docs/architecture/*-architecture.html
            docs/architecture/*-architecture.json
            docs/architecture/*-diff.html
          retention-days: 30

      # One comment per pull request, rewritten in place, and only when the
      # report changed. A new comment per push would bury the conversation, and
      # an identical rewrite still notifies everyone watching.
      - name: Comment the architecture diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- architecture-diff -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const site = `https://architecture-pr-${context.issue.number}.preview.borso.fr`;
            const isPublished = '${{ steps.publish.outcome }}' === 'success';
            const report = fs.readFileSync('/tmp/architecture-diff.md', 'utf8').trim();
            // Each application's own section carries the link to its map, so
            // the map is one tap from the lines that say what moved rather
            // than from a line at the bottom of a long comment. The marker the
            // step above wrote is what names the application; an application
            // the target branch does not have yet has no marker and no map.
            const appMarker = /^<!--architecture-app:(\S+)-->$/gm;
            const withMapLinks = isPublished
              ? report.replace(
                  appMarker,
                  (_marker, app) => `[Open the ${app} map ↗](${site}/${app}-diff.html)`,
                )
              : report.replace(appMarker, '').replace(/\n{3,}/g, '\n\n');
            // The link comes first because that is the whole point of it: on a
            // phone the report is several screens long, and a reader who wants
            // the map should not have to reach the end to find it.
            const opening = isPublished
              ? `**[Open the maps for this branch ↗](${site}/)** — no download, opens on a phone. Each map colours what this branch added, changed, moved or removed.`
              : `[Browse the full maps](${runUrl}#artifacts) — download the \`architecture-maps\` artifact and open \`index.html\`. The published copy could not be written this run.`;
            const body = [marker, opening, '', withMapLinks].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              return;
            }
            // Only rewrite when the report actually moved. A push that changes
            // no architecture produces the same body, and updating anyway emits
            // an issue_comment event that notifies every watcher and re-enters
            // any agent session subscribed to the pull request, for no news.
            //
            // The run identifier is the one part that changes on every run by
            // definition, so it is blanked on both sides rather than the line
            // carrying it: that line is now the fallback, and matching it by
            // its wording would silently stop working the day the wording
            // changes. The published link holds the pull request number, which
            // does not move.
            const withoutRunId = (text) => text.replace(/actions\/runs\/\d+/g, 'actions/runs/').trim();
            if (withoutRunId(existing.body ?? '') === withoutRunId(body)) {
              core.info('Architecture report unchanged; leaving the existing comment alone.');
              return;
            }
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });

  # The maps of a pull request that is over are dead weight at a live address.
  # The bucket would expire them after sixty days on its own, which is a long
  # time to serve a merged branch's architecture to anyone who kept the link.
  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete the maps published for this pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The prefix is the whole safety argument for a recursive delete, so
          # it is built from a variable that must be set and must be a number.
          # An empty PR number here would address the bucket root.
          case "${PR_NUMBER:?the pull request number is required}" in
            '' | *[!0-9]*) echo "::error::refusing to delete for PR_NUMBER='$PR_NUMBER'"; exit 1 ;;
          esac
          bucket="$(aws ssm get-parameter --name /borso/shared/previews-bucket-name \
            --query Parameter.Value --output text)"
          distribution="$(aws ssm get-parameter --name /borso/shared/previews-distribution-id \
            --query Parameter.Value --output text)"
          prefix="architecture/pr-$PR_NUMBER"
          # Quiet when there is nothing there: a pull request whose publish step
          # never ran, or a close replayed, is not a failure.
          aws s3 rm "s3://$bucket/$prefix/" --recursive --only-show-errors
          # Without this the edge goes on serving the deleted pages for its
          # default TTL, which is the same stale map at the same address.
          aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths "/$prefix/*" --query 'Invalidation.Id' --output text
