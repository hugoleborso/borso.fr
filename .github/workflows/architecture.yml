# The architecture maps, on demand only. Nothing runs them automatically: the
# build measured a median of 3.9 minutes and was the slowest check on about one
# commit in five, for pages most pull requests never opened.
#
# Dispatch with `pr_number` to build that pull request's head, compare it with
# its merge base, publish it to `architecture-pr-<n>.preview.borso.fr` and post
# or update the comment. Dispatch without it to build `main` and publish the
# maps to GitHub Pages through pages.yml. Dispatch from `main`: PreviewDeployRole
# trusts `main` and pull requests, not other branches.
#
# The generator runs at the head revision against a worktree of the base,
# through `--app-root`, so a base that predates the generator still compares.

name: architecture

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request to map. Empty maps main and publishes it to GitHub Pages.'
        required: false
        type: string
  # Only for the teardown below: a closed pull request's published maps go.
  pull_request:
    types: [closed]

concurrency:
  group: architecture-${{ inputs.pr_number || github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  architecture:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve the pull request
        id: target
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            '' | *[!0-9]*) echo "::error::pr_number must be a number, got '$PR_NUMBER'"; exit 1 ;;
          esac
          echo "base_ref=$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The pages are not committed, so this produces them for the artifact
      # below. It also refuses what `--check` would, an undeclared
      # `@DependsOnExternal` and the reverse included, since every refusal fires
      # without the flag, so a second `--check` run would only repeat the build.
      - name: Build the head model
        run: pnpm exec tsx scripts/architecture/architecture-graph.ts

      # A worktree of the merge base, scanned by the head revision's generator.
      # The merge base rather than the branch tip, so the comparison describes
      # this pull request and not whatever else landed on the target meanwhile.
      - name: Build the target-branch models and diff them
        env:
          BASE_REF: ${{ steps.target.outputs.base_ref }}
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "Comparing against $base_sha on $BASE_REF"
          git worktree add --detach ../architecture-base "$base_sha"
          : > /tmp/architecture-diff.md
          for app in $(pnpm exec tsx scripts/architecture/architecture-graph.ts --list); do
            # An application the target branch does not have yet cannot be
            # compared, and its whole map is new by definition.
            if [ ! -d "../architecture-base/apps/$app" ]; then
              printf '## %s\n\nNew application on this branch; nothing to compare.\n\n' "$app" \
                >> /tmp/architecture-diff.md
              continue
            fi
            pnpm exec tsx scripts/architecture/architecture-graph.ts \
              --app "$app" \
              --app-root "../architecture-base/apps/$app" \
              --out /tmp/architecture-base
            printf '## %s\n\n' "$app" >> /tmp/architecture-diff.md
            pnpm exec tsx scripts/architecture/architecture-diff.ts \
              "/tmp/architecture-base/$app-architecture.json" \
              "docs/architecture/$app-architecture.json" >> /tmp/architecture-diff.md
            # The same comparison as a map rather than a list: the head model's
            # own graphs, with each block coloured by what this branch did to it.
            # --diff-ref hands the generator the base revision, which is what
            # lets git pair a rename instead of reporting an addition beside a
            # deletion, and what lets the code dialog open on the change.
            pnpm exec tsx scripts/architecture/architecture-graph.ts \
              --app "$app" --diff-base /tmp/architecture-base --diff-ref "$base_sha"
            printf '\n' >> /tmp/architecture-diff.md
          done
          cat /tmp/architecture-diff.md >> "$GITHUB_STEP_SUMMARY"

      # The maps go to the previews CDN that already answers for
      # `<app>-pr-<n>.preview.borso.fr`. Its routing function reads any
      # `<name>-pr-<n>` host and serves `/<name>/pr-<n>/` from the previews
      # bucket, so `architecture` is just another name to it: no bucket, no
      # distribution, no certificate and no DNS record had to be added. Objects
      # in that bucket expire after 60 days, and the teardown job below removes
      # them when the pull request closes.
      #
      # Both steps may fail without failing the report. AWS being unreachable
      # is not a reason to lose the diff comment, and the artifact below still
      # carries the same pages.
      - name: Authenticate to AWS
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the maps
        id: publish
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          bucket="$(aws ssm get-parameter --name /borso/shared/previews-bucket-name \
            --query Parameter.Value --output text)"
          distribution="$(aws ssm get-parameter --name /borso/shared/previews-distribution-id \
            --query Parameter.Value --output text)"
          prefix="architecture/pr-$PR_NUMBER"
          aws s3 sync docs/architecture "s3://$bucket/$prefix/" --delete --only-show-errors
          # A push writes the same keys, and the edge would go on serving the
          # previous maps for its default TTL without this.
          aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths "/$prefix/*" --query 'Invalidation.Id' --output text

      # The page is the browsable half, and this artifact is what a reader who
      # wants the whole folder offline downloads.
      - name: Upload the browsable page
        uses: actions/upload-artifact@v7
        with:
          name: architecture-maps
          path: |
            docs/architecture/index.html
            docs/architecture/*-architecture.html
            docs/architecture/*-architecture.json
            docs/architecture/*-diff.html
          retention-days: 30

      # One comment per pull request, rewritten in place, and only when the
      # counts changed. A new comment per push would bury the conversation, and
      # an identical rewrite still notifies everyone watching.
      - name: Comment the architecture diff
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- architecture-diff -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = Number(process.env.PR_NUMBER);
            const site = `https://architecture-pr-${prNumber}.preview.borso.fr`;
            const isPublished = '${{ steps.publish.outcome }}' === 'success';
            // The counts only. The full report — routes added, files moved,
            // externals reached — is in the job summary and on the maps
            // themselves, and repeating it here made a comment several screens
            // long on a phone that nobody scrolled to the end of. What a
            // reader wants from the conversation is which applications moved
            // and how much, and a way in.
            const summaries = fs
              .readdirSync('docs/architecture')
              .filter((name) => name.endsWith('-diff.json'))
              .map((name) => ({
                app: name.slice(0, -'-diff.json'.length),
                counts: JSON.parse(fs.readFileSync(`docs/architecture/${name}`, 'utf8')).counts,
              }))
              .filter((entry) => entry.counts.some((count) => count.value > 0))
              .sort((left, right) => left.app.localeCompare(right.app));
            // A rename carries no sign: the map pairs it rather than reporting
            // an addition beside a deletion, so it is not a change to the
            // architecture. The diff page still lists every one.
            const signs = [['added', '+'], ['edited', '~'], ['removed', '−']];
            const deltasOf = (counts) =>
              signs
                .map(([label, sign]) => [sign, counts.find((c) => c.label === label)?.value ?? 0])
                .filter(([, value]) => value > 0)
                .map(([sign, value]) => `${sign}${value}`)
                .join(' ');
            const lines = summaries.map((entry) =>
              isPublished
                ? `- **[${entry.app}](${site}/${entry.app}-diff.html)** \`${deltasOf(entry.counts)}\``
                : `- **${entry.app}** \`${deltasOf(entry.counts)}\``,
            );
            const opening = isPublished
              ? `**[Architecture maps for this branch ↗](${site}/)**`
              : `**[Architecture maps](${runUrl}#artifacts)** — the published copy could not be written this run, so this is the \`architecture-maps\` artifact.`;
            const verdict =
              lines.length === 0
                ? ['', 'No application’s architecture moved on this branch.']
                : ['', ...lines];
            const body = [
              marker,
              opening,
              ...verdict,
              '',
              `<sub>Files added, edited and removed per application. The full report is in the <a href="${runUrl}">job summary</a>.</sub>`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = prNumber;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              return;
            }
            // Only rewrite when the report actually moved. A push that changes
            // no architecture produces the same body, and updating anyway emits
            // an issue_comment event that notifies every watcher and re-enters
            // any agent session subscribed to the pull request, for no news.
            //
            // The run identifier is the one part that changes on every run by
            // definition, so it is blanked on both sides rather than the line
            // carrying it: that line is now the fallback, and matching it by
            // its wording would silently stop working the day the wording
            // changes. The published link holds the pull request number, which
            // does not move.
            const withoutRunId = (text) => text.replace(/actions\/runs\/\d+/g, 'actions/runs/').trim();
            if (withoutRunId(existing.body ?? '') === withoutRunId(body)) {
              core.info('Architecture report unchanged; leaving the existing comment alone.');
              return;
            }
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });

  main:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number == ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      maps: true

  # The maps of a pull request that is over are dead weight at a live address.
  # The bucket would expire them after sixty days on its own, which is a long
  # time to serve a merged branch's architecture to anyone who kept the link.
  teardown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete the maps published for this pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The prefix is the whole safety argument for a recursive delete, so
          # it is built from a variable that must be set and must be a number.
          # An empty PR number here would address the bucket root.
          case "${PR_NUMBER:?the pull request number is required}" in
            '' | *[!0-9]*) echo "::error::refusing to delete for PR_NUMBER='$PR_NUMBER'"; exit 1 ;;
          esac
          bucket="$(aws ssm get-parameter --name /borso/shared/previews-bucket-name \
            --query Parameter.Value --output text)"
          distribution="$(aws ssm get-parameter --name /borso/shared/previews-distribution-id \
            --query Parameter.Value --output text)"
          prefix="architecture/pr-$PR_NUMBER"
          # Quiet when there is nothing there: a pull request whose publish step
          # never ran, or a close replayed, is not a failure.
          aws s3 rm "s3://$bucket/$prefix/" --recursive --only-show-errors
          # Without this the edge goes on serving the deleted pages for its
          # default TTL, which is the same stale map at the same address.
          aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths "/$prefix/*" --query 'Invalidation.Id' --output text
