# Publishes every generated report to GitHub Pages, and the architecture maps
# when asked, so a link opens them instead of a download of a workflow artifact.
# On demand only: someone dispatches it, or the `architecture` workflow calls
# it. Nothing publishes on a push.
#
# None of these files is in git, so this is the address they have. A report
# nobody can reach is a report nobody reads, and the alternative — committing
# them — is what made the two most-changed files in this repository generated
# ones that conflicted on every merge.
#
# This needs one repository setting the workflow cannot make or read: Settings →
# Pages → Build and deployment → Source must be "GitHub Actions". Until that is
# set, this workflow fails on the deploy step with a 404 and nothing else
# breaks.
#
# The maps build only with `maps: true`, which the `architecture` workflow
# passes when dispatched without a pull request. Pages replaces the whole site
# on each deploy, so a dispatch without `maps` publishes the reports without
# the maps.

name: pages

on:
  workflow_dispatch:
    inputs:
      maps:
        description: 'Build and publish the architecture maps too.'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      maps:
        required: false
        default: false
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Whole history: `hotspots.ts` and `temporal-coupling.ts` read the git log,
      # and against a shallow clone they render a report of the last commit and
      # call it the repository's churn.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before the reports, because `temporal-coupling.ts` reads the models.
      - name: Build the maps
        if: inputs.maps
        run: pnpm exec tsx scripts/architecture/architecture-graph.ts

      # The reports land under `docs/architecture/reports/`, beside the maps
      # when they are built, because `upload-pages-artifact` takes one path.
      # The blueprint heatmap is HTML and opens as a page; the rest are
      # markdown, which Pages serves as plain text — enough to read on a phone,
      # which is more than a file that exists nowhere.
      - name: Build the reports
        run: |
          set -euo pipefail
          for generator in \
            .claude/skills/blueprint/blueprint-indexing.ts \
            .claude/skills/blueprint/blueprint-heatmap.ts \
            scripts/blueprints/blueprint-defects.ts \
            scripts/standards/convention-drift.ts \
            scripts/standards/rule-provenance.ts \
            scripts/standards/hotspots.ts \
            scripts/standards/temporal-coupling.ts \
            scripts/quality/weak-points.ts \
            scripts/quality/working-conditions.ts; do
            pnpm exec tsx "$generator"
          done
          mkdir -p docs/architecture/reports
          cp .claude/skills/blueprint/blueprint-index.md \
             .claude/skills/blueprint/blueprint-coverage.html \
             docs/standards/blueprint-defects.md \
             docs/standards/convention-drift.md \
             docs/standards/rule-provenance.md \
             docs/standards/hotspots.md \
             docs/standards/temporal-coupling.md \
             docs/quality/weak-points.html \
             docs/quality/working-conditions.html \
             docs/architecture/reports/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/architecture
      - id: deploy
        uses: actions/deploy-pages@v5
