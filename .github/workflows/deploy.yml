# Production deploys. Trusts repo:hugoleborso/borso.fr:environment:prod
# via ProdDeployRole. The `prod` GitHub environment is kept ONLY to scope
# the OIDC subject the role trusts — it carries no reviewer rule, so the
# deploy job runs automatically. The gate is the merge to main, which a
# person or Claude performs when the operator asks for that pull request,
# so an approval click here would be redundant.
#
# Triggers on every push to main. paths-filter detects which apps
# changed in the latest commit; if infra/cdk changed, every app
# redeploys (constructs are the contract).
#
# The apps deploy in parallel. Every prod stack shares the one borso.fr
# hosted zone, but each writes only its own A and AAAA alias records under
# a hostname no other app uses, and a single stack already sends its A and
# AAAA changes to that zone at the same time. Nothing else a prod stack
# writes is shared: DSQL clusters and their SSM parameters are per app, and
# the certificate and zone ids are only read.
# fail-fast: false — one app failing must not cancel the others'
# turn; each app's deploy is independent.

name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency: deploy-prod

# Run JS-based actions on Node 24 — Node 20 will be removed from runners
# in Sep 2026. Drop this once every action below ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml
          # No `base:` — paths-filter defaults to ${{ github.event.before }}
          # for push events, which is the SHA of the previous main commit.
          # Specifying `base: HEAD~1` triggers a `git merge-base HEAD~1 main`
          # lookup that fails with `git exit 128` because `main` isn't set
          # up as a local tracking branch with fetch-depth=2.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          BASE: ${{ github.event.before }}
        run: |
          all_apps=$(pnpm ls -r --depth -1 --filter "./apps/*" --json \
            | jq -c '[.[] | .name | sub("@borso-app/"; "")]')
          # A package.json edit that only rewrites a check script (lint,
          # typecheck, test, dev) changes nothing a deploy runs, yet matches
          # its app's own key, and `infra/cdk/package.json` matches `infra`,
          # which fans out to every app. PR #155 redeployed all six apps to
          # production for a lint script. Such keys are dropped here; any
          # error keeps the changes as they were.
          # See docs/dantotsus/a-lint-script-redeployed-every-app.md.
          if jq -e 'index("deps")' <<<"$CHANGES" >/dev/null; then
            if kept=$(pnpm exec tsx scripts/dependencies/drop-check-only-changes.ts \
              "$BASE" "$CHANGES"); then
              CHANGES="$kept"
            fi
          fi
          # `infra` fans out: constructs are the contract every app builds on.
          if jq -e 'index("infra")' <<<"$CHANGES" >/dev/null; then
            echo "apps=$all_apps" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apps=$(jq -c --argjson all "$all_apps" \
            'map(select(. as $c | $all | index($c)))' <<<"$CHANGES")
          # `deps` names no app, so the lockfile is asked which apps resolve
          # something different from the previous main commit. An app-only
          # dev dependency then deploys that app, not all six. Anything the
          # script cannot read, a base commit outside the fetch depth
          # included, falls back to every app.
          # See docs/dantotsus/a-dev-dependency-that-redeployed-every-app.md.
          if jq -e 'index("deps")' <<<"$CHANGES" >/dev/null; then
            mapfile -t candidates < <(jq -r '.[]' <<<"$all_apps")
            moved=$(pnpm exec tsx scripts/dependencies/apps-with-changed-dependencies.ts \
              changed "$BASE" "${candidates[@]}") || moved="$all_apps"
            apps=$(jq -cn --argjson named "$apps" --argjson moved "$moved" '$named + $moved | unique')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: prod # scopes the OIDC subject ProdDeployRole trusts; no reviewer gate
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    env:
      STAGE: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      # Front reads this at build time (Sentry tagging + gating non-prod-only
      # affordances like the test-fixture panel in admin).
      VITE_STAGE: prod
      # Error reporting, for pragma only. The DSN is a public ingest key, so it
      # is a variable of the prod environment; the upload token is a secret
      # and reaches no other application's build. One Sentry project serves
      # the monorepo (ADR-0031). Unset values leave Sentry off: the site and
      # the API both treat an empty DSN as no project.
      VITE_SENTRY_DSN: ${{ matrix.app == 'pragma' && vars.SENTRY_DSN || '' }}
      PRAGMA_SENTRY_DSN: ${{ matrix.app == 'pragma' && vars.SENTRY_DSN || '' }}
      SENTRY_AUTH_TOKEN: ${{ matrix.app == 'pragma' && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_ORG: borsofr
      SENTRY_PROJECT: borsofr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm --filter "@borso-app/${{ matrix.app }}" run deploy
      # The only thing here that talks to a real DSQL cluster. Every suite
      # mocks the driver, so a connection parameter, a transaction syntax or a
      # role mapping the cluster refuses reaches the first invocation of a
      # deployed function and nothing earlier. See
      # docs/dantotsus/the-connection-parameter-no-mock-could-refuse.md.
      - run: scripts/smoke-agent-reader.sh "${{ matrix.app }}"
