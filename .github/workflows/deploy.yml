# Production deploys. Trusts repo:hugoleborso/borso.fr:environment:prod
# via ProdDeployRole. The `prod` GitHub environment is kept ONLY to scope
# the OIDC subject the role trusts — it carries no reviewer rule, so the
# deploy job runs automatically. The gate is the merge to main, which a
# person or Claude performs when the operator asks for that pull request,
# so an approval click here would be redundant.
#
# Triggers on every push to main. paths-filter names the apps whose input
# surface moved since the previous main commit (every app when infra/cdk or a
# dependency manifest moved). Each of those is then synthesized at both commits,
# and only the apps whose CloudFormation templates or asset hashes differ deploy.
# A lint script, a README, a test, a dev dependency or the release label leaves
# the synthesized output identical, so it deploys nothing, with no list of
# exceptions to keep. See docs/dantotsus/a-lint-script-redeployed-every-app.md.
#
# The apps deploy in parallel. Every prod stack shares the one borso.fr
# hosted zone, but each writes only its own A and AAAA alias records under
# a hostname no other app uses, and a single stack already sends its A and
# AAAA changes to that zone at the same time. Nothing else a prod stack
# writes is shared: DSQL clusters and their SSM parameters are per app, and
# the certificate and zone ids are only read.
# fail-fast: false — one app failing must not cancel the others'
# turn; each app's deploy is independent.

name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency: deploy-prod

# Run JS-based actions on Node 24 — Node 20 will be removed from runners
# in Sep 2026. Drop this once every action below ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    # The synthesis below reads what the deploy job reads, minus the secrets,
    # the release label and the Sentry settings, which are the same at both
    # commits and so cannot tell them apart.
    env:
      STAGE: prod
      VITE_STAGE: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml
          # No `base:` — paths-filter defaults to ${{ github.event.before }}
          # for push events, which is the SHA of the previous main commit.
          # Specifying `base: HEAD~1` triggers a `git merge-base HEAD~1 main`
          # lookup that fails with `git exit 128` because `main` isn't set
          # up as a local tracking branch with fetch-depth=2.
      - if: steps.filter.outputs.changes != '[]'
        uses: pnpm/action-setup@v6
      - if: steps.filter.outputs.changes != '[]'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.changes != '[]'
        env:
          BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          pnpm install --frozen-lockfile
      - id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          BASE: ${{ github.event.before }}
        run: |
          all_apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)
          # `infra` and `deps` name no app and can move what every app builds.
          if jq -e 'index("infra") or index("deps")' <<<"$CHANGES" >/dev/null; then
            candidates="$all_apps"
          else
            candidates=$(jq -c --argjson all "$all_apps" \
              'map(select(. as $c | $all | index($c)))' <<<"$CHANGES")
          fi
          if [ "$candidates" = "[]" ]; then
            echo "apps=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep only the candidates whose synthesized output differs from the
          # previous main commit. If the script itself fails, every candidate
          # deploys: the comparison can only remove work.
          mapfile -t names < <(jq -r '.[]' <<<"$candidates")
          apps=$(pnpm exec tsx scripts/deploy/apps-whose-output-changed.ts "$BASE" "${names[@]}") \
            || apps="$candidates"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: prod # scopes the OIDC subject ProdDeployRole trusts; no reviewer gate
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    env:
      STAGE: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      # Front reads this at build time (Sentry tagging + gating non-prod-only
      # affordances like the test-fixture panel in admin).
      VITE_STAGE: prod
      # Error reporting, for every app. The DSN, the org and the project are
      # variables of the prod environment; the upload token is a secret and
      # reaches only pragma's build. One Sentry project serves the monorepo
      # (ADR-2026-10-10T0457), and each app tags its events with `app`. Unset values
      # leave Sentry off: every site and API treats an empty DSN as no project.
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      PRAGMA_SENTRY_DSN: ${{ matrix.app == 'pragma' && vars.SENTRY_DSN || '' }}
      LAST_LOOP_LEPIN_SENTRY_DSN: ${{ matrix.app == 'last-loop-lepin' && vars.SENTRY_DSN || '' }}
      BANANA_RUSH_SENTRY_DSN: ${{ matrix.app == 'banana-rush' && vars.SENTRY_DSN || '' }}
      SKULL_KING_SENTRY_DSN: ${{ matrix.app == 'skull-king' && vars.SENTRY_DSN || '' }}
      TALOS_SENTRY_DSN: ${{ matrix.app == 'talos' && vars.SENTRY_DSN || '' }}
      BORSOUVERTURES_SENTRY_DSN: ${{ matrix.app == 'borsouvertures' && vars.SENTRY_DSN || '' }}
      SENTRY_AUTH_TOKEN: ${{ matrix.app == 'pragma' && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      # A `vars.X` that does not exist reads as an empty string, and an empty
      # DSN is the designed off switch, so pragma ran in prod with Sentry off
      # for 17 days after #163 and nothing said so. ADR-2026-10-10T0457 has it on in prod.
      # See docs/dantotsus/the-variable-the-workflow-set-to-nothing.md.
      - name: Refuse to deploy with Sentry off
        run: |
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::error::vars.SENTRY_DSN is empty in the prod environment, so ${{ matrix.app }} would deploy with Sentry off. Set it, or delete this step and say why in the commit."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm --filter "@borso-app/${{ matrix.app }}" run deploy
      # The only thing here that talks to a real DSQL cluster. Every suite
      # mocks the driver, so a connection parameter, a transaction syntax or a
      # role mapping the cluster refuses reaches the first invocation of a
      # deployed function and nothing earlier. See
      # docs/dantotsus/the-connection-parameter-no-mock-could-refuse.md.
      - run: scripts/smoke-agent-reader.sh "${{ matrix.app }}"
