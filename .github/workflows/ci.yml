# Continuous integration: typecheck, lint, dead-code, coverage, build
# on every PR and every push to main.
#
# Coverage is enforced for the infra packages and for every `*.utils.ts`
# / `*.core.ts` file (100% statements/branches/functions/lines, gated by
# each workspace's vitest config — see CLAUDE.md "Clean code").
#
# Three jobs: `build` (typecheck/lint/build/infra-tests/knip), `app-tests`
# (vitest for every app, with a Postgres service for last-loop-lepin's
# back-e2e gate), and `commitlint` (PR-only).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Run JS-based actions on Node 24 — Node 20 will be removed from runners
# in Sep 2026. Drop this once every action below ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Whole history: the dantotsu check resolves every fix commit an entry
      # names against origin/main, and a shallow clone holds one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra build
      - run: pnpm -r typecheck
      # The repository's own tooling, which `-r` cannot reach: `scripts/`,
      # `.claude/skills/` and `eslint-rules/` belong to no workspace, so they
      # were type-checked by nothing until this ran. `tsx` strips types without
      # reading them, so a name that no longer exists runs until the branch that
      # reaches it. Rung-1 eradication of
      # docs/dantotsus/the-tooling-that-gates-everything-was-checked-by-nothing.md.
      - run: pnpm run typecheck
      # oxlint over the repository with every rule, the type-aware ones
      # included: one process for every workspace and the files that belong to
      # none, e.g. scripts/ and eslint-rules/. Defence in depth on top of the
      # commit and push hooks, catching commits that bypassed them. Warnings
      # fail it through `denyWarnings` in .oxlintrc.json. Rung-1 eradication,
      # paired with the hooks, of
      # docs/dantotsus/biome-lint-was-not-gated-anywhere.md. No cache: the run
      # measured 28 s over the repository on 2026-10-25.
      - run: scripts/lint-repository.sh
      # Formatter drift is part of the gate. A commit made with hooks
      # skipped, or from an editor that is not on oxfmt, fails here.
      - run: pnpm run format:check
      # The custom lint rules under eslint-rules/ each ship a RuleTester
      # suite, and the generators under scripts/ carry the same 100% per-file
      # coverage threshold an application's pure modules do. `test:eslint-rules`
      # ran the suite without `--coverage`, so the threshold in
      # `vitest.config.ts` was declared and never applied to anything.
      - run: pnpm run test:coverage
      # DSQL-compat scan on every migration SQL file. Mirrors the
      # pre-commit hook so a bypass via `git push --no-verify` still
      # gets caught before merge. Rung-2 eradication (paired with the
      # hook) of docs/dantotsus/dsql-alter-table-only-add-column.md.
      - run: ./scripts/check-migration-sql-dsql-compat.sh
      # And that no number in a numbered sequence — a migrations folder, the
      # ADRs — is claimed twice. The collision is invisible to git: two
      # branches add differently named files, so the commit hook never sees
      # both sides and only the merge does.
      - run: ./scripts/check-numbered-sequences.sh
      # And that no ADR heading states a number other than its filename's, which
      # is what a renumber leaves behind when it moves the file only.
      - run: ./scripts/check-adr-numbers-resolve.sh
      # And that no skill, agent or standard tells an agent to run a command
      # this repository does not install. Prose has no build step.
      - run: ./scripts/check-instructions-name-installed-tools.sh
      # And that a document a script, hook or workflow cites is there. The
      # markdown link check does not read them, so their citations went unread.
      - run: ./scripts/check-named-paths-exist.sh
      # And that every harness skill, agent and hook in plugins/borso-harness/
      # is linked into .claude/, which is the only place a session reads it.
      - run: ./scripts/check-harness-links.sh
      # One stylesheet per application, mirroring the pre-commit hook so a push
      # made with hooks skipped still gets caught.
      - run: ./scripts/check-single-stylesheet.sh
      # And that the one stylesheet holds tokens only: counting the files never
      # opens one, so a global `.classname` rule inside it had no gate at all.
      - run: ./scripts/check-stylesheet-contents.sh
      # Every directory under apps/ has a path-filters key and a commitlint
      # scope. Without the first the app never gets a preview deploy and no
      # workflow reports it; without the second the first commit naming the app
      # is rejected by a hook talking about an enum.
      - run: ./scripts/check-app-registration.sh
      # One version per dependency, written in pnpm-workspace.yaml. Nothing
      # else here reads a version field, so two workspaces drifting onto
      # different majors passes every other gate.
      # A NUL byte inside a string literal is legal, invisible in every editor
      # and diff, and accepted by ESLint, Prettier and tsc. It surfaces much
      # later as an argument execFileSync refuses or a separator that stops
      # matching.
      # Each term in an application's vocabulary names the folder that owns it,
      # and that folder gets renamed by changes with no reason to open the
      # vocabulary.
      - run: ./scripts/check-vocabulary-paths.sh
      - run: ./scripts/check-no-null-bytes.sh
      - run: pnpm exec tsx scripts/dependencies/check-dependency-catalog.ts
      # Every `VITE_` variable a site reads is set by a workflow or written
      # down as deliberately unset, mirroring the pre-commit hook so a push
      # made with hooks skipped still gets caught.
      - run: ./scripts/check-frontend-env-vars.sh
      # Every icon a web app manifest names resolves to a file that ships,
      # mirroring the pre-commit hook so a push made with hooks skipped still
      # gets caught. A broken icon path installs a grey square and fails
      # nothing else here.
      - run: ./scripts/check-pwa-assets.sh
      # A "this tool does not work" note with no date steers every future agent
      # away from the tool and fails silently forever, because nobody runs the
      # command it warned them off. Mirrors the pre-commit hook.
      - run: ./scripts/check-negative-claims-are-dated.sh
      # Every knowledge entry declares the paths, commands or output it applies
      # to, so a hook can deliver it. Mirrors the pre-commit hook.
      - run: ./scripts/check-knowledge-triggers.sh
      # Two lists that have to say the same thing — the generator's trigger
      # paths, and the suffixes the coverage gate and the sibling-test rule both
      # name. Each half reads correctly alone; only the pair is wrong.
      - run: ./scripts/check-coupled-lists.sh
      - run: pnpm exec tsx scripts/docs/check-doc-links.ts
      # A pure module reached only from its own test passes coverage and
      # mutation at full marks while running nowhere, and knip cannot see it.
      - run: ./scripts/check-pure-modules-have-callers.sh
      # A non-module <script src> tag ships un-bundled and 404s in preview and
      # production. Mirrors the pre-commit hook, which was the only place it
      # ran, so `--no-verify` disabled it for good.
      - run: ./scripts/check-non-module-scripts.sh
      # A directory walk piped into `head` or `grep -q` is a race, and `pipefail`
      # turns the losing side into a failing script — which is how this one was
      # found, green locally and red here on the same commit.
      - run: ./scripts/check-no-racy-pipelines.sh
      # The whole-tree runs of the checks the commit hook reads only a slice of.
      - run: ./scripts/check-no-comments-in-styles-and-markup.sh
      - run: ./scripts/check-tailwind-arbitrary-variants.sh
      - run: ./scripts/check-package-scripts-are-commands.sh
      - run: pnpm exec tsx scripts/pr/check-pr-body.ts plugins/borso-harness/skills/open-pr/template.md
      # `deploy`, `destroy`, `install`, `update`, `sync`, `fetch` and `publish`
      # are pnpm built-ins: without `run`, pnpm shadows the package's scripts
      # entry and silently does the wrong thing. Mirrors the pre-commit hook,
      # which was the only place this ran, so `--no-verify` disabled it for
      # good. Rung-2 eradication of docs/dantotsus/pnpm-reserved-script-names.md.
      - name: Workflows do not shadow a pnpm built-in script name
        run: |
          pattern='pnpm[[:space:]]+--filter[[:space:]]+("[^"]+"|[^[:space:]]+)[[:space:]]+(deploy|destroy|install|update|sync|fetch|publish)([[:space:]]|$)'
          if grep -nrE "$pattern" .github/workflows/ >&2; then
            echo "ERROR: above lines invoke a pnpm built-in instead of a package script." >&2
            echo "Use 'pnpm --filter <pkg> run <name>' to force script lookup." >&2
            exit 1
          fi
      # Blueprint annotations, mirroring the pre-commit hook so a push made
      # with hooks skipped still gets caught. Fails on a blueprint missing one
      # of its four tags, a duplicated identifier, and a follower naming a
      # blueprint that does not exist.
      #
      # Staleness is no longer among them, here or anywhere: none of these
      # files is committed, so `--check` regenerates and reports rather than
      # comparing bytes against a copy in git. What is gated is what a person
      # can get wrong.
      - run: pnpm exec tsx .claude/skills/blueprint/blueprint-indexing.ts --check
      # The dantotsu record: fixed value lists, fix commits that resolve on
      # main, no placeholder, a level its eradication paths support, and a
      # recurrence linked rather than retold. Mirrors the pre-commit hook, which
      # resolves only the staged entries' commits; this resolves all of them.
      - run: pnpm exec tsx scripts/quality/check-dantotsu-front-matter.ts
      - run: pnpm exec tsx scripts/standards/convention-drift.ts --check
      - run: pnpm --filter @borso/infra test:coverage
      - run: pnpm --filter @borso/shared-infra test:coverage
      - run: pnpm -r build
      # The CDK synth the standards claim CI runs, which until now it did not:
      # `pnpm -r build` is `vite build`, and the per-app stack tests call
      # `build<App>Stack()` directly, so nothing exercised `cdk/bin/*.ts` — the
      # file that reads STAGE, names the stacks and wires the cluster stack to
      # the app stack. A break there passes every gate and fails the automatic
      # prod deploy after the merge instead. `run synth` rather than `synth`
      # per the pnpm reserved-name rule above, even though `synth` is not one
      # of the seven. Measured at about 12 s per app on this repository.
      #
      # The account is a placeholder because synth only stamps it into the
      # template: no stack here does a `fromLookup`, so the run needs no
      # credentials and reaches no AWS endpoint.
      #
      # Scoped to the applications rather than `-r`: `@borso/shared-infra`'s
      # synth wants BORSO_BUDGET_EMAIL, and that stack is already synthesized
      # by its own template snapshot test above, which asserts on the result
      # instead of only proving it built.
      - run: pnpm --filter "@borso-app/*" run synth
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
      - run: pnpm exec knip

  # Which apps this change actually touches. An `infra/cdk` change means all of
  # them, because the constructs are the contract. No `base:` on paths-filter —
  # it defaults to github.event.before on push, and naming HEAD~1 fails with
  # git exit 128. See docs/dantotsus/paths-filter-base-head1-on-push.md.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml
      - id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          # App slugs are the directory names under apps/, which is exactly what
          # pnpm-workspace.yaml declares as `apps/*`. Reading them off the
          # checkout keeps this job to a checkout: it used to install the whole
          # workspace purely to run `pnpm ls`, about 25 s sitting in front of
          # every matrix that waits on this output.
          all_apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R . | jq -sc .)
          # `infra` and `deps` are the two fan-out keys: constructs are the
          # contract every app builds on, and the catalog decides what every
          # app resolves. Either one changing means every app is tested, and
          # neither names an app, so neither can be matched below.
          if jq -e 'index("infra") or index("deps")' <<<"$CHANGES" >/dev/null; then
            echo "apps=$all_apps" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apps=$(jq -c --argjson all "$all_apps" \
            'map(select(. as $c | $all | index($c)))' <<<"$CHANGES")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # One job per changed app, in parallel, rather than one job running all four
  # in sequence. A pull request touching a single app now pays for that app.
  # The unscoped run over every app lives in full-suite.yml, on main.
  app-tests:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
      fail-fast: false
    # One Postgres per matrix job, so the two full-stack apps no longer share a
    # runner and cannot see each other's tables. Front-end-only apps ignore it;
    # the container costs a few seconds and keeps this job uniform.
    # test/setup-postgres.ts trusts DATABASE_URL verbatim, so generic
    # credentials work for every app.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cdk/test/stack.test.ts` in the full-stack apps imports `@borso/infra`
      # via its package entry — the CDK constructs must be built first.
      - run: pnpm --filter @borso/infra build
      # `test:core` where it exists — the full-stack apps, whose `test:coverage`
      # wants a Postgres — and `test:coverage` otherwise. Both carry the 100%
      # per-file threshold on `*.core.ts` / `*.utils.ts`.
      - name: Pure suites and the per-file coverage gate
        run: |
          if grep -q '"test:core"' "apps/$APP/package.json"; then
            pnpm --filter "@borso-app/$APP" run test:core
          else
            pnpm --filter "@borso-app/$APP" run test:coverage
          fi
      - name: Back-end end-to-end suite
        if: hashFiles(format('apps/{0}/api/**', matrix.app)) != ''
        run: pnpm --filter "@borso-app/$APP" exec vitest run --project back-e2e

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      # A dated validation report is true as of the day in
      # its own file name, so a repository-wide rename reaching into one
      # destroys the record rather than correcting it. This job rather than
      # `build`, because it is the one with the whole history and the base ref:
      # the check reads a range, and `build` checks out at depth 1, where a
      # `--cached` read would be a gate that always passes.
      - run: ./scripts/check-dated-records-are-append-only.sh "origin/${{ github.base_ref }}"
