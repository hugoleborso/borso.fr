# Manual deploy of @borso/shared-infra. Trusts
# repo:hugoleborso/borso.fr:environment:prod-shared via
# SharedInfraDeployRole.
#
# workflow_dispatch only — shared infra rarely changes and we don't
# want a stray push to main rewriting OIDC providers, deploy roles,
# or the previews CDN. Trigger from the Actions tab → "Shared infra
# deploy" → "Run workflow".
#
# The gate on `deploy` is the `confirm` input below, checked in the repo.
# This file used to claim the `prod-shared` GitHub environment required a
# reviewer's approval first. It does not: run 7 was dispatched at 14:28:05
# and its job started at 14:28:09, four seconds later, with nothing to
# approve. An environment with no protection rule only scopes the OIDC
# subject the role trusts — it stops another workflow from assuming
# SharedInfraDeployRole, and stops nothing a dispatcher does. A gate that
# lives in a settings page no test can read is a gate nobody can verify;
# this one lives in the file. See
# docs/dantotsus/an-approval-gate-that-only-existed-in-a-comment.md.

name: shared-deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'CDK action'
        type: choice
        options: [deploy, diff, synth]
        default: diff
      confirm:
        description: 'Type deploy-shared-infra to allow action=deploy (ignored for diff/synth)'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency: shared-deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  shared:
    runs-on: ubuntu-latest
    environment: prod-shared
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      BORSO_BUDGET_EMAIL: ${{ vars.BORSO_BUDGET_EMAIL }}
    steps:
      # Before the checkout, so a mistyped confirmation costs no credentials.
      - name: Require a typed confirmation to deploy
        if: inputs.action == 'deploy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'deploy-shared-infra' ]; then
            echo "::error::action=deploy needs confirm=deploy-shared-infra. This stack owns the OIDC provider, the three deploy roles and the previews CDN; a wrong turn here locks every other workflow out of the account."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SHARED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk ${{ inputs.action }}
        run: pnpm --filter @borso/shared-infra run ${{ inputs.action }}
