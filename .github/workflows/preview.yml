# Per-PR preview deploys. Trusts repo:hugoleborso/borso.fr:pull_request
# via PreviewDeployRole (provisioned by infra/shared).
#
# Flow:
#   detect → which apps changed in this PR (or all, if infra/cdk changed)
#   deploy → matrix per affected app, skip the ones whose inputs are
#            already deployed, otherwise cdk deploy <app>-pr-<n> and
#            sticky comment the preview URL on the PR
#   teardown → on PR close, iterate every app and cdk destroy. Failures
#              are swallowed (the stack might never have existed).
#
# `detect` answers "what does this pull request touch", not "what changed
# since this preview was last built": dorny/paths-filter on a pull_request
# event diffs against the base branch, so a pull request that renamed a file
# in all four apps re-entered the matrix for all four on every later push,
# including pushes that only moved a markdown file. That is the right answer
# to the question the job asks, and the wrong one to ask, so the matrix asks
# the second question itself — see the fingerprint step in `deploy`.
#
# concurrency: never cancel in-flight deploys mid-CFN-transaction or
# you orphan stack state. Each PR has its own concurrency group.

name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Run JS-based actions on Node 24 — Node 20 will be removed from runners
# in Sep 2026. Drop this once every action below ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml
      - id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          # App slugs are the directory names under apps/, which is exactly what
          # pnpm-workspace.yaml declares as `apps/*`. Reading them off the
          # checkout keeps this job to a checkout: it used to install the whole
          # workspace purely to run `pnpm ls`, about 25 s sitting in front of
          # every matrix that waits on this output.
          # All app slugs from the workspace (dynamic — no hard-coded list).
          all_apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R . | jq -sc .)

          # If infra/cdk changed, redeploy every app's preview — constructs
          # are the contract.
          if jq -e 'index("infra")' <<<"$CHANGES" >/dev/null; then
            echo "apps=$all_apps" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise intersect changes with known apps.
          apps=$(jq -c --argjson all "$all_apps" \
            'map(select(. as $c | $all | index($c)))' <<<"$CHANGES")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
      fail-fast: false
    env:
      STAGE: preview
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      PREVIEW_URL: https://${{ matrix.app }}-pr-${{ github.event.pull_request.number }}.preview.borso.fr
      # Baked into the frontend bundle at build time (Vite reads VITE_*
      # env vars). Mirrors `previewApiHostname()` in @borso/infra — change
      # both together. Same-origin /api routing on previews is intentional
      # future work (see docs/knowledge/preview-api-cross-origin.md).
      VITE_API_BASE: https://${{ matrix.app }}-pr-${{ github.event.pull_request.number }}-api.preview.borso.fr
      # Surfaces non-prod-only UI affordances (test fixture seeders, etc.).
      # Stage value also drives Sentry environment tagging.
      VITE_STAGE: preview
    steps:
      - uses: actions/checkout@v7
      # Digest of everything this app's preview is built from. Tree hashes
      # are exact: `HEAD:apps/<app>` changes if and only if some byte under
      # that directory changed. The list is the deploy's input surface —
      # the app, the constructs it composes, the dependency versions, the
      # Node version, and this file, which bakes VITE_API_BASE into the
      # bundle. Adding an input to the build without adding it here is the
      # failure mode: the preview would then go stale silently.
      - id: fingerprint
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # Each hash is assigned before it is digested, because a command
          # group swallows the exit status of everything but its last member:
          # `{ git rev-parse <missing>; git hash-object <file>; }` returns 0
          # and digests one line less, which is a different-but-valid digest
          # rather than the failure it is.
          trees=$(git rev-parse "HEAD:apps/${APP}" HEAD:infra/cdk)
          files=$(git hash-object pnpm-lock.yaml .nvmrc .github/workflows/preview.yml)
          digest=$(printf '%s\n%s\n' "$trees" "$files" | sha256sum | cut -d' ' -f1)
          echo "[fingerprint] ${APP} @ ${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # What is actually deployed, read from the GitHub Deployment the last
      # successful run of this job opened: its payload carries the digest and
      # the commit it was built from. A deployment whose statuses never
      # reached `success` is ignored, so a failed deploy cannot claim its
      # inputs are live. Any error here yields an empty digest, which means
      # deploy — the check can only ever remove work, never skip wrongly.
      - id: deployed
        uses: actions/github-script@v9
        with:
          script: |
            const environment = `preview-${{ matrix.app }}-pr-${{ github.event.pull_request.number }}`;
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment,
                per_page: 20,
              });
              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                });
                if (!statuses.some((status) => status.state === 'success')) continue;
                const payload =
                  typeof deployment.payload === 'string'
                    ? JSON.parse(deployment.payload || '{}')
                    : deployment.payload;
                core.setOutput('fingerprint', payload?.fingerprint ?? '');
                core.setOutput('sha', payload?.sha ?? '');
                core.info(`last successful deploy of ${environment}: ${payload?.sha ?? 'unknown sha'}`);
                return;
              }
              core.info(`no successful deploy recorded for ${environment}`);
            } catch (error) {
              core.warning(`could not read deployments for ${environment}: ${error.message}`);
            }
            core.setOutput('fingerprint', '');
      # Two conditions have to hold to skip: the inputs match what was last
      # deployed, and the stack is still standing in a state that serves it.
      # The second is what makes the skip safe against an account someone
      # changed out of band — a deleted or rolled-back stack redeploys even
      # though the repository says nothing moved.
      - id: plan
        env:
          APP: ${{ matrix.app }}
          CURRENT_FINGERPRINT: ${{ steps.fingerprint.outputs.digest }}
          DEPLOYED_FINGERPRINT: ${{ steps.deployed.outputs.fingerprint }}
        run: |
          set -uo pipefail
          if [ -z "$CURRENT_FINGERPRINT" ] || [ "$DEPLOYED_FINGERPRINT" != "$CURRENT_FINGERPRINT" ]; then
            echo "[plan] inputs differ from the last successful deploy; deploying"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stack="${APP}-pr-${PR_NUMBER}"
          stack_status=$(aws cloudformation describe-stacks --stack-name "$stack" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
          case "$stack_status" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "[plan] $stack is $stack_status and already serves this build; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "[plan] $stack is $stack_status; deploying"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - if: steps.plan.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.plan.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.skip != 'true'
        run: pnpm --filter @borso/infra build
      # Open a GitHub Deployment so the PR sidebar shows the native
      # "Deployments" panel (Vercel/Netlify-style). Marked transient +
      # non-production so closing the PR auto-deactivates it. The payload is
      # what the next run reads to decide whether it has anything to do.
      - id: deployment
        if: steps.plan.outputs.skip != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview-${{ matrix.app }}-pr-${{ github.event.pull_request.number }}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `Preview of ${{ matrix.app }} for PR #${{ github.event.pull_request.number }}`,
              payload: {
                fingerprint: '${{ steps.fingerprint.outputs.digest }}',
                sha: context.payload.pull_request.head.sha,
              },
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('id', data.id);
      # Clean state left by previous failed runs (stack stuck in
      # ROLLBACK_COMPLETE, orphan log groups, orphan named buckets).
      # Idempotent — no-op on a clean account.
      - name: Preflight recovery
        if: steps.plan.outputs.skip != 'true'
        run: ./scripts/preflight-preview-recovery.sh "${{ matrix.app }}" "$PR_NUMBER"
      - if: steps.plan.outputs.skip != 'true'
        run: pnpm --filter "@borso-app/${{ matrix.app }}" run deploy
      # Auto-seed the preview so it lands populated. The `__test/seed`
      # endpoint is mounted by PreviewableApp on every non-prod API Lambda
      # (see infra/cdk/src/constructs/previewable-app.ts; commit a232c58);
      # it wipes domain tables and writes a coherent fixture. Prod never
      # sees this — the flag is structurally absent there, asserted by
      # infra unit tests.
      #
      # Whether an app has an API is read from the repository rather than
      # from a list here, so adding a full-stack app seeds it and adding a
      # front-end-only one skips it, with nothing to remember. The previous
      # version inferred it from the HTTP status and got it wrong: the
      # comment claimed front-end-only apps "short-circuit at the DNS
      # layer", but `*.preview.borso.fr` is a wildcard, so the API hostname
      # resolves and CloudFront answers a status like any other host.
      #
      # `last-loop-lepin` validates a `fixture` QUERY parameter and rejects
      # a call without one, so this step posted a bare URL and took a 400 on
      # every preview deploy since the endpoint was written. It failed as a
      # `::warning::`, which is a line nobody reads in a green run. Found by
      # the preview validation, not by the workflow. `pragma` takes no
      # parameter, so an empty query string is right for it.
      - name: Auto-seed preview (non-prod fixture)
        if: steps.plan.outputs.skip != 'true'
        shell: bash
        env:
          APP: ${{ matrix.app }}
          SEED_URL: ${{ env.VITE_API_BASE }}/api/__test/seed
          SEED_QUERY: ${{ matrix.app == 'last-loop-lepin' && '?fixture=race-down-to-one-survivor' || '' }}
        run: |
          set -uo pipefail
          if [ ! -d "apps/${APP}/api" ]; then
            echo "[seed] ${APP} is front-end only (no apps/${APP}/api); nothing to seed"
            exit 0
          fi
          # Skip only the combination that destroys data: a preview schema
          # cloned from production AND a seed that wipes before it writes.
          # pragma is both, so seeding would throw the clone away on every
          # deploy and leave a fixture behind — the opposite of what the clone
          # is for. Its auth row arrives with the clone too, so there is
          # nothing to bootstrap either.
          #
          # last-loop-lepin also clones, but its seed only upserts, so the
          # fixture lands alongside the cloned edition and seeding stays
          # correct. Testing "clones" alone would have silently changed that.
          #
          # Both halves are read from the repository rather than listed here,
          # so the rule cannot drift from the code it describes, and the
          # default stays "seed" for any new full-stack app.
          if grep -rq 'cloneFromSchema' "apps/${APP}/cdk/lib/stack.ts" &&
             grep -rq 'deleteAllDomainRows' "apps/${APP}/api/src/__test/"; then
            echo "[seed] ${APP} clones production and its seed wipes; skipping the destructive fixture"
            exit 0
          fi
          status=$(curl -sS --max-time 30 -o /tmp/seed-response.txt -w "%{http_code}" -X POST "${SEED_URL}${SEED_QUERY}" 2>/dev/null || echo "000")
          case "$status" in
            200|201)
              echo "[seed] ${SEED_URL}${SEED_QUERY} -> $status :: $(cat /tmp/seed-response.txt)"
              ;;
            *)
              # This app has an API, so a seed that does not answer 200 is a
              # broken preview rather than a cosmetic problem. Fail rather
              # than warn, because warning is what let the 400 sit unnoticed.
              echo "::error::[seed] ${SEED_URL}${SEED_QUERY} -> $status (preview deployed but seed failed): $(cat /tmp/seed-response.txt 2>/dev/null || echo '<no response body>')"
              exit 1
              ;;
          esac
      # A skipped app still refreshes its comment, so a reader can tell a
      # preview that is current from one that never got built.
      - id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          SKIPPED: ${{ steps.plan.outputs.skip }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$SKIPPED" = "true" ]; then
            note="Unchanged — <code>${HEAD_SHA::7}</code> touches nothing this app is built from, so the preview built at <code>${DEPLOYED_SHA::7}</code> still stands"
          else
            note="Updated from <code>${HEAD_SHA::7}</code>"
          fi
          echo "note=$note · <a href=\"$RUN_URL\">build log</a>" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-${{ matrix.app }}
          message: |
            ### Preview — `${{ matrix.app }}`

            <${{ env.PREVIEW_URL }}>

            <sub>${{ steps.meta.outputs.note }}</sub>
      # Close the GitHub Deployment with the final state. Runs whether
      # the deploy step succeeded or failed so the PR panel never gets
      # stuck in "in_progress".
      - if: always() && steps.deployment.outputs.id
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      STAGE: preview
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borso/infra build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: apps
        run: |
          apps=$(pnpm ls -r --depth -1 --filter "./apps/*" --json \
            | jq -c '[.[] | .name | sub("@borso-app/"; "")]')
          echo "list=$apps" >> "$GITHUB_OUTPUT"
      - name: Destroy every app's per-PR stack
        env:
          APPS_JSON: ${{ steps.apps.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          for app in $(jq -r '.[]' <<<"$APPS_JSON"); do
            stack="$app-pr-$PR_NUMBER"
            # Probe before destroy so a genuinely-missing stack (PR was
            # never deployed, or already torn down) stays quiet while a
            # real cdk-destroy failure surfaces. The previous form was
            # `cdk destroy || echo`, which conflated the two and let
            # broken destroys ship as silent green.
            if ! aws cloudformation describe-stacks \
                --stack-name "$stack" >/dev/null 2>&1; then
              echo "[skip] $stack: stack does not exist"
              continue
            fi
            echo "[teardown] destroying $stack..."
            if pnpm --filter "@borso-app/$app" run destroy; then
              echo "[ok] $stack destroyed"
            else
              echo "::error::$stack: cdk destroy exited non-zero"
              failures+=("$stack")
            fi
          done
          if (( ${#failures[@]} )); then
            echo "::error::${#failures[@]} stack(s) failed to destroy: ${failures[*]}"
            echo "cleanup-orphans nightly will retry, but investigate the root cause now."
            exit 1
          fi
      # Mark each preview Deployment inactive so the PR sidebar reflects
      # that the URL is gone. transient_environment + auto_inactive on the
      # active status mean GitHub already hides it once the env is unused;
      # we set state=inactive explicitly so the PR timeline reads cleanly.
      - if: always()
        uses: actions/github-script@v9
        env:
          APPS_JSON: ${{ steps.apps.outputs.list }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const apps = JSON.parse(process.env.APPS_JSON);
            for (const app of apps) {
              const env = `preview-${app}-pr-${process.env.PR_NUMBER}`;
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: env,
              });
              for (const d of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: d.id,
                  state: 'inactive',
                });
              }
            }
